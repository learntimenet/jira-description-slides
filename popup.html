<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jira Description Slides</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="icons/icon128.png" alt="">
      <div>
        <h1>Description Slides</h1>
        <p class="brand-sub">by Learn Time</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button id="btn-sidepanel" class="icon-btn" title="Open in side panel" aria-label="Open in side panel" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ LOADING ============ -->
  <section id="view-loading" class="view">
    <div class="card hero"><span class="eyebrow">Reading the issue…</span></div>
  </section>

  <!-- ============ NOTHING TO PRESENT ============ -->
  <section id="view-none" class="view" hidden>
    <div class="card hero">
      <span class="eyebrow" id="none-title">No Jira issue</span>
      <p id="none-text" class="none-text"></p>
    </div>
  </section>

  <!-- ============ MAIN ============ -->
  <section id="view-main" class="view" hidden>
    <div class="card hero issue-bar">
      <div class="issue-text">
        <span class="eyebrow" id="issue-key"></span>
        <span id="issue-summary" class="issue-summary"></span>
        <span id="level-note" class="note"></span>
      </div>
      <span id="slide-count" class="pill"></span>
    </div>

    <div class="card settings-card">
      <div class="card-head"><h2>Customize</h2></div>
      <div class="settings-body plain">
        <div class="row static">Split on
          <span class="seg" role="group" aria-label="Split slides on" data-setting="level">
            <button type="button" data-value="H1">Heading 1</button>
            <button type="button" data-value="H2">Heading 2</button>
          </span>
        </div>
        <div class="row static">Theme
          <span class="seg" role="group" aria-label="Theme" data-setting="theme">
            <button type="button" data-value="learntime"><span class="swatch learntime"></span>Learn Time</button>
            <button type="button" data-value="light"><span class="swatch light"></span>Light</button>
            <button type="button" data-value="dark"><span class="swatch dark"></span>Dark</button>
          </span>
        </div>
        <div class="row static">Text size
          <span class="seg" role="group" aria-label="Text size" data-setting="textSize">
            <button type="button" data-value="small" aria-label="Small">S</button>
            <button type="button" data-value="medium" aria-label="Medium">M</button>
            <button type="button" data-value="large" aria-label="Large">L</button>
          </span>
        </div>
        <label class="row">Cover slide with agenda <input type="checkbox" class="switch" data-setting="cover"></label>
        <label class="row">Footer: title and slide number <input type="checkbox" class="switch" data-setting="footer"></label>
        <label class="row">Issue links as title and status <input type="checkbox" class="switch" data-setting="issueLinks"></label>
      </div>
    </div>

    <button id="present" class="primary cta">
      <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7 4 20 12 7 20 7 4"/></svg>
      Present
    </button>
    <p class="shortcut"><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> presents with these settings</p>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
